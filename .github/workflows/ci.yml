name: CI Pipeline
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  go-build-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.x
      - name: Download Dependencies
        run: go mod download
      - name: Run Linter
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t test-image .
  e2e:
    name: E2E Provisioner Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.x
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
      - name: Run E2E Test
        run: bash e2e/test_provisioner_e2e.sh

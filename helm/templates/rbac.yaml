apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-path
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: golden-path-manager
rules:
- apiGroups: ["core.goldenpath.io"]
  resources: ["goldenpaths", "goldenpaths/status", "goldenpaths/finalizers"]
  verbs: ["get", "list", "watch", "update", "patch", "status"]
- apiGroups: [""]
  resources: ["namespaces", "resourcequotas", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: golden-path-manager-binding
subjects:
- kind: ServiceAccount
  name: golden-path
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: golden-path-manager
  apiGroup: rbac.authorization.k8s.io

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformservices.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: PlatformService
    listKind: PlatformServiceList
    plural: platformservices
    singular: platformservice
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                team:
                  type: string
                tier:
                  type: string
                  enum: [frontend, backend, worker]
                exposeExternally:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                namespace:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Team
          type: string
          jsonPath: .spec.team
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Status
          type: string
          jsonPath: .status.phase
